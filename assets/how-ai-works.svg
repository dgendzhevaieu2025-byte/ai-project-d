<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="t">
  <title id="t">How AI works: data, training, model, output</title>
  <rect width="800" height="200" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="20" y="50" width="160" height="100" rx="8" fill="#f2f2f2" stroke="#555"/>
    <text x="100" y="90" font-size="20" font-weight="bold" fill="#222">1. Data</text>
    <text x="100" y="118" font-size="14" fill="#555">lots of text &amp; images</text>

    <rect x="220" y="50" width="160" height="100" rx="8" fill="#f2f2f2" stroke="#555"/>
    <text x="300" y="90" font-size="20" font-weight="bold" fill="#222">2. Training</text>
    <text x="300" y="118" font-size="14" fill="#555">finds patterns</text>

    <rect x="420" y="50" width="160" height="100" rx="8" fill="#f2f2f2" stroke="#555"/>
    <text x="500" y="90" font-size="20" font-weight="bold" fill="#222">3. Model</text>
    <text x="500" y="118" font-size="14" fill="#555">learned patterns</text>

    <rect x="620" y="50" width="160" height="100" rx="8" fill="#c0392b"/>
    <text x="700" y="90" font-size="20" font-weight="bold" fill="#fff">4. Output</text>
    <text x="700" y="118" font-size="14" fill="#fff">right... or wrong!</text>

    <line x1="182" y1="100" x2="216" y2="100" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="382" y1="100" x2="416" y2="100" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="582" y1="100" x2="616" y2="100" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="400" y="185" font-size="14" fill="#555">A human should always check the output.</text>
  </g>
</svg>
